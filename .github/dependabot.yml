version: 2
updates:
  # Update Python dependencies
  - package-ecosystem: 'uv'
    labels:
      - 📦 dependencies
    directory: '/'
    commit-message:
      prefix: 'chore(deps)'
    schedule:
      interval: 'weekly'

  # Update the Docker base image
  - package-ecosystem: 'docker'
    labels:
      - 📦 dependencies
    directory: '/'
    commit-message:
      prefix: 'chore(deps)'
    schedule:
      interval: 'weekly'
