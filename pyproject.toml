[project]
name = "bill-please-ocr"
version = "0.1.0"
description = "Receipt OCR service for bill-please-mcp (PP-OCRv5 on ONNX Runtime GPU, Thai + English)"
authors = [
    { name = "Chatree.js", email = "36321701+chatreejs@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.3.5",
    # onnxruntime-gpu 1.27 and later need CUDA 13 and driver 580. 1.26 is the last release for CUDA 12.
    # It has Linux and Windows wheels only, so the unit tests on a Mac run without it.
    "onnxruntime-gpu[cuda,cudnn]==1.26.0 ; sys_platform == 'linux'",
    "opencv-python-headless==4.10.0.84",
    "pi-heif>=1.4.0",
    "pillow>=13.0.0",
    # Expands the text boxes, as in PaddleX
    "pyclipper>=1.4.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package keeps its descriptive name; the project is named after the repo
module-name = "receipt_ocr"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The models tests load the converted ONNX models. Run them with `uv run pytest -m models`.
addopts = "-m 'not models'"
markers = ["models: runs the real ONNX models on tests/fixtures/receipts (slow)"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
